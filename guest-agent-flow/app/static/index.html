<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Guest assistant · guest-agent-flow</title>
<link rel="stylesheet" href="/static/app.css" />
</head>
<body>
<header>
  <h1>Guest assistant</h1>
  <p class="sub">Every turn runs the governed LangGraph turn. The panel on the right is the audit trace.</p>
</header>

<main>
  <section class="chat" aria-label="Conversation">
    <div id="transcript" class="transcript" aria-live="polite"></div>

    <div id="suggestions" class="suggestions"></div>

    <form id="composer" class="composer" autocomplete="off">
      <input id="utterance" name="utterance" placeholder="Ask about a stay…" aria-label="Message" />
      <button type="submit">Send</button>
    </form>
  </section>

  <aside class="side">
    <section class="card">
      <h2>Request context</h2>
      <p class="hint">Brand, guest, market and stay dates come from here, never from the message.</p>
      <label>Brand
        <select id="brand">
          <option value="B-LUX" selected>B-LUX · rung 2, preview then confirm</option>
          <option value="B-HARBOR">B-HARBOR · rung 3, book and notify</option>
          <option value="B-EXPRESS">B-EXPRESS · rung 1, draft only</option>
          <option value="B-CLASSIC">B-CLASSIC · search only, no agentic booking</option>
        </select>
      </label>
      <label>Guest
        <select id="guest"></select>
      </label>
      <label>Check in
        <input id="checkin" type="date" value="2026-06-12" />
      </label>
      <label>Check out
        <input id="checkout" type="date" value="2026-06-14" />
      </label>
      <label>Conversation
        <input id="conversation" readonly />
      </label>
      <button type="button" id="reset" class="ghost">New conversation</button>
    </section>

    <section class="card">
      <h2>Turn trace</h2>
      <div id="trace" class="trace">Send a message to see the nodes that ran.</div>
    </section>
  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
