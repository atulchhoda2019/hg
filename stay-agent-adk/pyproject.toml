[project]
name = "stay-agent-adk"
version = "0.1.0"
description = "Stay Agent on Google ADK: room truth extraction, versioned attributes, and a corridor around money."
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pillow>=10.0", "ruff>=0.4"]
trace = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-gcp-trace>=1.7"]
deploy = ["google-cloud-aiplatform[adk,agent_engines]>=1.95"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stay_agent", "review_ui"]

[tool.setuptools.package-data]
stay_agent = ["registry/*.yaml", "mocks/floorplans/*.json", "mocks/floorplans/*.png"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
