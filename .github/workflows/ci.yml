name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guest-agent-flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guest-agent-flow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Validate served config
        run: python scripts/validate_config.py
      - name: Tests
        run: python -m pytest -q
      - name: Decider golden set
        run: python scripts/decider_experiment.py
